<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Piatra Hârtia Foarfeca</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🪨 Piatra, 📄 Hârtia, ✂️ Foarfeca</h1>

    <button id="rock">Piatra</button>
    <button id="paper">Hârtia</button>
    <button id="scissors">Foarfeca</button>

    <h2 id="playerChoice">Alegerea ta: -</h2>

    <h2 id="computerChoice">Alegerea calculatorului: -</h2>

    <h2 id="result">Alege o variantă!</h2>

    <h2>Scor</h2>

    <p>Tu: <span id="playerScore">0</span></p>
    <p>Calculator: <span id="computerScore">0</span></p>
    <p>Egalități: <span id="draws">0</span></p>

    <button id="newGame">Joc nou</button>

    <script src="script.js"></script>

</body>
</html>
